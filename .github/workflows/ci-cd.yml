# CI/CD do backend (Django + Channels).
#
#   PR e push   → testes (Postgres + Redis de serviço) e checagem de migrações.
#   push na main → imagem no Docker Hub (<usuário>/rotacerta-backend:sha-xxxxxxx e :latest)
#                  e deploy no k3s da EC2 (troca a imagem do deployment "backend"; o initContainer
#                  "migrate" aplica as migrações antes do pod novo subir).
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD (use um access token do Docker Hub),
#   EC2_HOST, EC2_USER, EC2_SSH_KEY (conteúdo do .pem).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: rotacerta-backend
  K8S_NAMESPACE: rota-certa
  K8S_DEPLOYMENT: backend

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: route_monitoring
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d route_monitoring"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DEBUG=True libera o host "testserver" do cliente de testes (ALLOWED_HOSTS).
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/route_monitoring?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test core --noinput

  image:
    name: Imagem no Docker Hub
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no k3s (EC2)
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Atualizar o deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          NS: ${{ env.K8S_NAMESPACE }}
          DEPLOY: ${{ env.K8S_DEPLOYMENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD,NS,DEPLOY
          script_stop: true
          script: |
            set -euo pipefail
            KUBECTL="sudo k3s kubectl -n $NS"
            # Credencial para o k3s baixar imagem privada do Docker Hub (recriada a cada deploy).
            $KUBECTL create secret docker-registry dockerhub \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="$DOCKERHUB_USERNAME" --docker-password="$DOCKERHUB_PASSWORD" \
              --dry-run=client -o yaml | $KUBECTL apply -f -
            $KUBECTL patch deployment "$DEPLOY" --type merge \
              -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"dockerhub"}]}}}}'
            $KUBECTL set image deployment/"$DEPLOY" backend="$IMAGE" migrate="$IMAGE"
            $KUBECTL rollout status deployment/"$DEPLOY" --timeout=300s
            echo "Backend em produção: $IMAGE"
